[package]
name = "cisco-tui"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1.38", features = ["full"] }
russh = "0.45"
russh-keys = "0.45"
async-trait = "0.1"
ratatui = "0.26"
crossterm = { version = "0.27", features = ["event-stream"] }
futures = "0.3"
anyhow = "1.0"
chrono = "0.4"

# Lint policy: a panic inside the TUI would leave the user's terminal in raw mode, so
# `unwrap`/`expect` are forbidden in production code (tests are exempt via `clippy.toml`).
[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"

[profile.release]
opt-level = 3
debug = false
debug-assertions = false
overflow-checks = false
lto = "fat"
codegen-units = 1
strip = "symbols"
panic = "abort"
incremental = false


