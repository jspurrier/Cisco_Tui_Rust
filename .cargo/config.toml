# Static runtime configuration so compiled binaries (.exe on Windows or static Linux builds)
# can be copied to any PC and run directly without installing external runtime DLLs.

[target.x86_64-pc-windows-msvc]
rustflags = ["-C", "target-feature=+crt-static"]

[target.x86_64-pc-windows-gnu]
rustflags = ["-C", "target-feature=+crt-static"]

[target.x86_64-unknown-linux-musl]
rustflags = ["-C", "target-feature=+crt-static"]
